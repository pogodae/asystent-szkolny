# Testy offline generatora blueprintów Make (bez sekretów i bez operacji Make) przy każdym pushu i PR.
name: Testy

on:
  push:
  pull_request:

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Testy jednostkowe (make/build.py)
        run: python -m unittest discover -s tests -t . -v
