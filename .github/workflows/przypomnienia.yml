# S3 – przypomnienie dzień przed terminem. Darmowy plan Make pozwala na 2 aktywne scenariusze, więc harmonogram
# trzyma GitHub Actions: raz dziennie wieczorem wywołuje webhook API z ?cel=przypomnienia.
# 17:30 UTC = 18:30 zimą / 19:30 latem w Polsce.
name: Przypomnienia

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

jobs:
  przypomnienia:
    runs-on: ubuntu-latest
    steps:
      - name: Wywołaj S3 w Make
        env:
          API_URL: ${{ secrets.MAKE_API_WEBHOOK_URL }}
          API_KEY: ${{ secrets.S1W_API_KEY }}
        run: |
          curl --fail-with-body -sS -X POST "$API_URL?cel=przypomnienia" -H "X-Api-Key: $API_KEY"
