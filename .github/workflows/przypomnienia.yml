# S3 – przypomnienie dzień przed terminem. Darmowy plan Make pozwala na 2 aktywne scenariusze, więc harmonogram
# trzyma GitHub Actions: raz dziennie rano wywołuje webhook API z ?cel=przypomnienia.
# 6:00 UTC = 7:00 zimą / 8:00 latem w Polsce – dzień przed terminem, żeby był czas zareagować.
name: Przypomnienia

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  przypomnienia:
    runs-on: ubuntu-latest
    steps:
      - name: Wywołaj S3 w Make
        env:
          API_URL: ${{ secrets.MAKE_API_WEBHOOK_URL }}
          API_KEY: ${{ secrets.S1W_API_KEY }}
        run: |
          curl --fail-with-body -sS -X POST "$API_URL?cel=przypomnienia" -H "X-Api-Key: $API_KEY"
