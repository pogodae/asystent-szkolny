<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Kto to ogarnia</title>
<style>
:root {
  --bg: #f4f4f5; --card: #ffffff; --fg: #18181b; --muted: #71717a; --line: #e4e4e7;
  --blue: #2563eb; --green: #16a34a; --orange: #ea580c; --red: #dc2626; --chip: #f4f4f5;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113; --card: #1c1c1f; --fg: #f4f4f5; --muted: #a1a1aa; --line: #2e2e33;
    --blue: #3b82f6; --green: #22c55e; --orange: #f97316; --red: #ef4444; --chip: #27272a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111113; --card: #1c1c1f; --fg: #f4f4f5; --muted: #a1a1aa; --line: #2e2e33;
  --blue: #3b82f6; --green: #22c55e; --orange: #f97316; --red: #ef4444; --chip: #27272a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 12px 16px 8px;
  border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: center; gap: 12px; max-width: 1280px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0; flex: 1; }
.icon-btn { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 10px;
  padding: 8px 12px; font-size: 15px; cursor: pointer; }
.stats { display: flex; gap: 8px; max-width: 1280px; margin: 10px auto 0; flex-wrap: wrap; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 14px; }
.stat b { font-size: 18px; margin-right: 4px; }
.stat.red b { color: var(--red); }
.tabs { display: flex; gap: 6px; max-width: 1280px; margin: 10px auto 0; overflow-x: auto; }
.tab { flex: 1; border: 0; border-radius: 10px; padding: 9px 6px; background: var(--chip); color: var(--fg);
  font-size: 15px; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--blue); color: #fff; }
main { max-width: 1280px; margin: 0 auto; padding: 12px 16px 40px; }
.board { display: grid; grid-template-columns: 1fr; gap: 16px; }
.col { min-width: 0; }
.col h2 { font-size: 16px; margin: 4px 0 10px; display: flex; justify-content: space-between; align-items: center; }
.col h2 .n { color: var(--muted); font-weight: 400; }
.col[hidden] { display: none; }
.card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 12px 12px 16px; margin-bottom: 10px; overflow: hidden; transition: opacity .2s; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: transparent; }
.card.soon::before { background: var(--orange); }
.card.late::before { background: var(--red); }
.card.busy { opacity: .55; pointer-events: none; }
.title { font-weight: 600; font-size: 16px; margin: 0 0 4px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; color: var(--muted); font-size: 14px; }
.meta .late { color: var(--red); font-weight: 600; }
.meta .soon { color: var(--orange); font-weight: 600; }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--chip); color: var(--fg); }
.badge.wisi { background: var(--orange); color: #fff; }
details { margin-top: 6px; font-size: 14px; }
details summary { cursor: pointer; color: var(--muted); }
details p { white-space: pre-line; margin: 6px 0 0; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; margin-top: 10px; }
.actions button { flex: 1; border: 0; border-radius: 10px; padding: 11px 8px; font-size: 15px; font-weight: 600;
  cursor: pointer; color: #fff; background: var(--blue); }
.actions .done { background: var(--green); }
.actions .ghost { background: var(--chip); color: var(--fg); }
.empty { color: var(--muted); font-size: 14px; padding: 8px 2px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100% - 32px);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 15px;
  box-shadow: 0 4px 20px rgba(0,0,0,.2); z-index: 5; }
.notice { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; max-width: 520px; margin: 40px auto; }
.done-col details > summary { list-style: none; }
@media (min-width: 900px) {
  .tabs { display: none; }
  .board { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .col[hidden] { display: block; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Kto to ogarnia</h1>
    <button class="icon-btn" id="refresh" title="Odśwież">↻ Odśwież</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
</header>
<main id="main"></main>
<div class="toast" id="toast" hidden></div>

<script>
// ---- konfiguracja (adres API = webhook Make z ?cel=api; dane chroni para u + s) ----
const CONFIG = {
  api: "https://hook.eu2.make.com/wpcm5vpf5m75aeb84hk2ukxvcc7sky5v?cel=api",
  rodzice: ["Ewa", "Dawid"],
  wisiPoGodzinach: 4,
};

const H = 3600e3;
const state = { ja: "", zadania: [], tab: "wolne", busy: new Set() };
const $ = (id) => document.getElementById(id);

// ---- logowanie: ?u=&s= raz zapisane w localStorage i usunięte z paska adresu ----
function store(key, val) {
  try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; }
}
function login() {
  const p = new URLSearchParams(location.search);
  if (p.get("u") && p.get("s")) {
    store("u", p.get("u")); store("s", p.get("s"));
    p.delete("u"); p.delete("s");
    history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p : ""));
  }
  return { u: store("u"), s: store("s"), demo: p.get("demo") === "1" };
}
const auth = login();

// ---- API: proste POST-y (form-urlencoded), bez preflightu ----
async function call(akcja, id) {
  if (auth.demo) return demoCall(akcja, id);
  const body = new URLSearchParams({ u: auth.u || "", s: auth.s || "", akcja });
  if (id) body.set("id", id);
  const r = await fetch(CONFIG.api, { method: "POST", body });
  const j = await r.json().catch(() => ({ ok: false, powod: "blad" }));
  if (!r.ok || !j.ok) throw Object.assign(new Error(j.powod || "blad"), { powod: j.powod });
  return j;
}

// ---- formatowanie ----
const fmtTime = new Intl.DateTimeFormat("pl-PL", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Warsaw" });
const fmtDate = new Intl.DateTimeFormat("pl-PL", { day: "numeric", month: "short", timeZone: "Europe/Warsaw" });
const dayKey = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Warsaw" }).format(d);
function kiedy(iso) {
  const d = new Date(iso), now = new Date();
  const diffDays = Math.round((new Date(dayKey(d)) - new Date(dayKey(now))) / 864e5);
  const t = fmtTime.format(d);
  if (diffDays === 0) return `dziś ${t}`;
  if (diffDays === 1) return `jutro ${t}`;
  if (diffDays === -1) return `wczoraj ${t}`;
  if (diffDays > 1 && diffDays < 7) return `za ${diffDays} dni, ${t}`;
  if (diffDays < -1 && diffDays > -7) return `${-diffDays} dni temu`;
  return `${fmtDate.format(d)}, ${t}`;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---- model ----
function view(z) {
  const f = z.fields, termin = new Date(f["Termin"]), now = Date.now();
  return {
    id: z.id, tytul: f["Tytuł"] || "(bez tytułu)", opis: f["Opis"] || "", kwota: f["Kwota"],
    status: f["Status"], osoba: (f["Osoba imię"] || "").trim(), termin,
    late: termin < now && f["Status"] !== "Zrobione",
    soon: termin >= now && termin - now < 24 * H,
    wisi: f["Status"] === "Nowe" && now - new Date(f["Utworzono"]) > CONFIG.wisiPoGodzinach * H,
    zrobiono: f["Zrobiono"] ? new Date(f["Zrobiono"]) : null,
  };
}
function columns() {
  const inny = CONFIG.rodzice.find((r) => r !== state.ja) || "Druga osoba";
  const all = state.zadania.map(view);
  const byTermin = (a, b) => a.termin - b.termin;
  return [
    { key: "wolne", label: "Wolne", items: all.filter((z) => z.status === "Nowe").sort(byTermin) },
    { key: "moje", label: state.ja || "Moje", items: all.filter((z) => z.status === "Przypisane" && z.osoba === state.ja).sort(byTermin) },
    { key: "inne", label: inny, items: all.filter((z) => z.status === "Przypisane" && z.osoba !== state.ja).sort(byTermin) },
    { key: "zrobione", label: "Zrobione", items: all.filter((z) => z.status === "Zrobione").sort((a, b) => (b.zrobiono || 0) - (a.zrobiono || 0)) },
  ];
}

// ---- widok ----
function card(z, col) {
  const termCls = z.late ? "late" : z.soon ? "soon" : "";
  const btns = {
    wolne: [["take", "Biorę to", ""], ["done", "Zrobione", "done"]],
    moje: [["done", "Zrobione", "done"], ["release", "Oddaj", "ghost"]],
    inne: [["done", "Zrobione", "done"], ["przejmij", "Przejmij", "ghost"]],
    zrobione: [],
  }[col];
  return `<article class="card ${termCls} ${state.busy.has(z.id) ? "busy" : ""}" data-id="${z.id}">
    <p class="title">${esc(z.tytul)}</p>
    <div class="meta">
      <span class="${termCls}">${z.late ? "po terminie · " : ""}${esc(kiedy(z.termin))}</span>
      ${z.kwota ? `<span>${esc(z.kwota)} zł</span>` : ""}
      ${col === "inne" && z.osoba ? `<span class="badge">${esc(z.osoba)}</span>` : ""}
      ${col === "zrobione" && z.osoba ? `<span class="badge">${esc(z.osoba)}</span>` : ""}
      ${z.wisi ? `<span class="badge wisi">wisi</span>` : ""}
    </div>
    ${z.opis ? `<details><summary>Szczegóły</summary><p>${esc(z.opis)}</p></details>` : ""}
    ${btns.length ? `<div class="actions">${btns.map(([a, l, c]) =>
      `<button class="${c}" data-akcja="${a}" data-id="${z.id}">${l}</button>`).join("")}</div>` : ""}
  </article>`;
}
function render() {
  const cols = columns();
  const all = state.zadania.map(view);
  $("stats").innerHTML =
    `<span class="stat"><b>${cols[0].items.length}</b>wolne</span>` +
    `<span class="stat"><b>${cols[1].items.length}</b>moje</span>` +
    `<span class="stat red"><b>${all.filter((z) => z.late).length}</b>po terminie</span>`;
  $("tabs").innerHTML = cols.map((c) =>
    `<button class="tab" role="tab" data-tab="${c.key}" aria-selected="${state.tab === c.key}">${esc(c.label)} ${c.items.length}</button>`).join("");
  $("main").innerHTML = `<div class="board">${cols.map((c) => {
    const list = c.items.map((z) => card(z, c.key)).join("") || `<p class="empty">Pusto</p>`;
    const body = c.key === "zrobione"
      ? `<details class="done-col"><summary class="empty">Pokaż ostatnie 7 dni (${c.items.length})</summary>${list}</details>`
      : list;
    return `<section class="col" ${state.tab === c.key ? "" : "hidden"}>
      <h2>${esc(c.label)} <span class="n">${c.items.length}</span></h2>${body}</section>`;
  }).join("")}</div>`;
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 3500);
}
function noAccess() {
  $("stats").innerHTML = ""; $("tabs").innerHTML = "";
  $("main").innerHTML = `<div class="notice"><h2>Brak dostępu</h2>
    <p>Otwórz swój osobisty link do tablicy (z parametrami <code>u</code> i <code>s</code>). Jeśli go nie masz, poproś o nowy.</p></div>`;
}

// ---- dane i akcje ----
async function load() {
  if (!auth.demo && (!auth.u || !auth.s)) return noAccess();
  try {
    const j = await call("lista");
    state.ja = j.ja; state.zadania = j.zadania || [];
    render();
  } catch (e) {
    if (e.powod === "brak_dostepu") return noAccess();
    toast("Nie udało się pobrać listy. Spróbuj odświeżyć.");
  }
}
const OCZEKIWANE = { take: "Przypisane", done: "Zrobione", release: "Nowe", przejmij: "Przypisane" };
async function act(akcja, id) {
  const idx = state.zadania.findIndex((z) => z.id === id);
  if (idx < 0) return;
  const before = structuredClone(state.zadania[idx]);
  // optymistycznie: karta od razu przechodzi do nowej kolumny
  const f = state.zadania[idx].fields;
  f["Status"] = OCZEKIWANE[akcja];
  if (akcja === "take" || akcja === "przejmij") f["Osoba imię"] = state.ja;
  if (akcja === "release") f["Osoba imię"] = "";
  if (akcja === "done") f["Zrobiono"] = new Date().toISOString();
  state.busy.add(id); render();
  try {
    const j = await call(akcja, id);
    const nf = j.zadanie.fields, kto = (nf["Osoba imię"] || "").trim();
    state.zadania[idx] = j.zadanie;
    if (akcja === "take" && nf["Status"] === "Przypisane" && kto !== state.ja) toast(`Już przejęte przez ${kto}`);
    else if (nf["Status"] !== OCZEKIWANE[akcja]) toast("Ktoś zmienił to zadanie w międzyczasie.");
  } catch (e) {
    state.zadania[idx] = before;
    toast(e.powod === "brak_dostepu" ? "Brak dostępu" : "Nie udało się. Spróbuj jeszcze raz.");
  } finally {
    state.busy.delete(id); render();
  }
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.akcja) act(b.dataset.akcja, b.dataset.id);
  else if (b.dataset.tab) { state.tab = b.dataset.tab; render(); }
  else if (b.id === "refresh") load();
});
// odświeżanie przy powrocie do karty i co 10 min, gdy strona jest widoczna
// (rzadziej niż w SPEC, bo darmowy plan Make ma limit operacji)
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, 10 * 60e3);

// ---- tryb demo (?demo=1): przykładowe dane bez API ----
function demoCall(akcja, id) {
  const now = Date.now(), iso = (h) => new Date(now + h * H).toISOString();
  if (akcja === "lista") {
    return Promise.resolve({ ok: true, ja: "Ewa", zadania: demoCall.data ||= [
      { id: "d1", fields: { "Tytuł": "Wycieczka do Krakowa", "Opis": "Przynieść 40 zł i podpisaną zgodę", "Termin": iso(40), "Kwota": 40, "Status": "Nowe", "Utworzono": iso(-6) } },
      { id: "d2", fields: { "Tytuł": "Zebranie z wychowawczynią", "Termin": iso(20), "Status": "Nowe", "Utworzono": iso(-1) } },
      { id: "d3", fields: { "Tytuł": "Strój na WF", "Opis": "Biała koszulka, granatowe spodenki", "Termin": iso(-3), "Status": "Przypisane", "Osoba imię": "Ewa", "Utworzono": iso(-30) } },
      { id: "d4", fields: { "Tytuł": "Opłata za obiady", "Termin": iso(100), "Kwota": 182.5, "Status": "Przypisane", "Osoba imię": "Dawid", "Utworzono": iso(-20) } },
      { id: "d5", fields: { "Tytuł": "Kredki na plastykę", "Termin": iso(-48), "Status": "Zrobione", "Osoba imię": "Dawid", "Zrobiono": iso(-50), "Utworzono": iso(-80) } },
    ] });
  }
  const z = structuredClone(demoCall.data.find((x) => x.id === id));
  const f = z.fields;
  if (akcja === "take" && f["Status"] === "Nowe") { f["Status"] = "Przypisane"; f["Osoba imię"] = "Ewa"; }
  else if (akcja === "done") { f["Status"] = "Zrobione"; f["Zrobiono"] = new Date().toISOString(); }
  else if (akcja === "release") { f["Status"] = "Nowe"; f["Osoba imię"] = ""; }
  else if (akcja === "przejmij") { f["Osoba imię"] = "Ewa"; }
  demoCall.data[demoCall.data.findIndex((x) => x.id === id)] = z;
  return new Promise((r) => setTimeout(() => r({ ok: true, zadanie: structuredClone(z) }), 500));
}

load();
</script>
</body>
</html>
