<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<title>Kto to ogarnia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --surface-2: #efefec; --fg: #1c1c1e; --fg-2: #4a4a52; --muted: #6f6f78;
  --line: #e7e7e3; --line-2: #dcdcd7;
  --accent: #4f46e5; --accent-fg: #ffffff; --accent-soft: #eef0ff; --accent-ink: #3730a3;
  --ok: #15803d; --ok-soft: #e8f6ec;
  --warn: #b45309; --warn-soft: #fdf3e2;
  --bad: #c62828; --bad-soft: #fdecea;
  --shadow: 0 1px 2px rgba(20,20,30,.04), 0 1px 1px rgba(20,20,30,.03);
  --shadow-lift: 0 8px 24px rgba(20,20,30,.08), 0 2px 6px rgba(20,20,30,.05);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121214; --surface: #1b1b1e; --surface-2: #232327; --fg: #ededef; --fg-2: #b4b4bb; --muted: #84848d;
    --line: #2a2a2f; --line-2: #34343a;
    --accent: #8b85ff; --accent-fg: #111114; --accent-soft: #23223a; --accent-ink: #c7c4ff;
    --ok: #4ade80; --ok-soft: #16261c;
    --warn: #f5b454; --warn-soft: #2b2316;
    --bad: #ff7b72; --bad-soft: #2e1a1a;
    --shadow: 0 1px 0 rgba(255,255,255,.02);
    --shadow-lift: 0 10px 30px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121214; --surface: #1b1b1e; --surface-2: #232327; --fg: #ededef; --fg-2: #b4b4bb; --muted: #84848d;
  --line: #2a2a2f; --line-2: #34343a;
  --accent: #8b85ff; --accent-fg: #111114; --accent-soft: #23223a; --accent-ink: #c7c4ff;
  --ok: #4ade80; --ok-soft: #16261c;
  --warn: #f5b454; --warn-soft: #2b2316;
  --bad: #ff7b72; --bad-soft: #2e1a1a;
  --shadow: 0 1px 0 rgba(255,255,255,.02);
  --shadow-lift: 0 10px 30px rgba(0,0,0,.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1;
}
button { font: inherit; color: inherit; }
svg { display: block; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- pasek demo (przewija się razem ze stroną) ---------- */
.demo-bar { display: flex; justify-content: center; align-items: center; gap: 6px 12px; flex-wrap: wrap; padding: 8px 16px;
  background: var(--accent-soft); color: var(--accent-ink); font-size: 13.5px; text-align: center; }
.demo-bar a { color: inherit; font-weight: 650; }

/* ---------- nagłówek: jednolite tło, bez prześwitywania kart ---------- */
header { position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 1px solid transparent; transition: border-color .2s; }
header.scrolled { border-bottom-color: var(--line); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
.top { display: flex; align-items: center; gap: 8px; padding: 16px 0 12px; }
.hello { flex: 1; min-width: 0; }
.hello h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
.hello p { margin: 1px 0 0; color: var(--muted); font-size: 13.5px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 14px;
  border-radius: 11px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer;
  font-size: 14.5px; font-weight: 600; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.icon { width: 40px; padding: 0; border-color: transparent; background: transparent; color: var(--fg-2); }
.btn.icon:hover { background: var(--surface-2); }
.btn.icon.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* zakładki (telefon) */
.tabs { display: flex; gap: 2px; padding: 3px; margin-bottom: 10px; background: var(--surface-2); border-radius: 12px; }
.tab {
  flex: 1; min-width: 0; border: 0; background: transparent; border-radius: 9px; padding: 8px 4px; cursor: pointer;
  font-size: 14.5px; font-weight: 600; color: var(--fg-2); display: flex; align-items: center; justify-content: center; gap: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tab .n { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.tab .n.bad { color: var(--bad); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow), 0 0 0 1px var(--line); }

/* filtr kategorii */
.filters { display: flex; gap: 6px; padding: 0 0 12px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip {
  display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px; flex: none;
  border: 1px solid var(--line-2); background: transparent; cursor: pointer; font-size: 13.5px; font-weight: 550; color: var(--fg-2);
}
.fchip:hover { background: var(--surface-2); }
.fchip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--kat, var(--muted)); flex: none; display: inline-block; }

/* ---------- lista spraw ---------- */
main { padding-top: 2px; padding-bottom: 110px; }
.board { display: grid; grid-template-columns: 1fr; gap: 28px; }
.col { min-width: 0; }
.col[hidden] { display: none; }
.col-head { display: none; align-items: baseline; gap: 8px; margin: 4px 2px 2px; }
.col-head h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.col-head .n { font-size: 14px; color: var(--muted); font-weight: 600; }
.col-head .toggle { margin-left: auto; border: 0; background: none; color: var(--accent); font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 4px; }

.group { margin-top: 18px; }
.group:first-child { margin-top: 4px; }
.group-head { display: flex; align-items: center; gap: 6px; margin: 0 4px 8px; font-size: 12.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.group-head .n { font-weight: 600; letter-spacing: 0; }
.group.late .group-head { color: var(--bad); }

.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.item { position: relative; display: flex; align-items: flex-start; gap: 4px; padding: 10px 6px 10px 4px; transition: opacity .2s; }
.item + .item { border-top: 1px solid var(--line); }
.item.busy { opacity: .45; pointer-events: none; }
/* kółko po lewej = Zrobione (duże pole dotyku, małe kółko) */
.tick { width: 44px; height: 44px; margin: -8px 0 -8px; flex: none; display: grid; place-items: center; border: 0; background: none; cursor: pointer; }
.tick span { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center;
  color: transparent; transition: border-color .15s, color .15s, background .15s; }
.tick span svg { width: 13px; height: 13px; }
.tick:hover span { border-color: var(--ok); color: var(--ok); }
.item.late .tick span { border-color: color-mix(in srgb, var(--bad) 55%, var(--line-2)); }
.body { flex: 1; min-width: 0; padding-top: 1px; }
.t { margin: 0; font-size: 15.5px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 0; margin-top: 2px; font-size: 13.5px; color: var(--fg-2); }
.meta > span + span::before { content: "·"; margin: 0 7px; color: var(--muted); }
.meta .late { color: var(--bad); font-weight: 600; }
.meta .kat { display: inline-flex; align-items: center; gap: 5px; }
.meta .kat .dot { width: 7px; height: 7px; }
.opis { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); white-space: pre-line; overflow-wrap: anywhere; cursor: pointer;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.opis.open { -webkit-line-clamp: unset; display: block; }
.kebab { width: 40px; height: 40px; margin: -6px 0; flex: none; border: 0; border-radius: 10px; background: transparent; color: var(--muted);
  display: grid; place-items: center; cursor: pointer; }
.kebab:hover, .kebab[aria-expanded="true"] { background: var(--surface-2); color: var(--fg); }
.kebab svg { width: 18px; height: 18px; }
.menu { position: absolute; right: 6px; top: 46px; z-index: 5; min-width: 220px; padding: 5px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 13px; box-shadow: var(--shadow-lift); }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 11px; border: 0; border-radius: 9px;
  background: none; text-align: left; font-size: 14.5px; font-weight: 500; cursor: pointer; }
.menu button:hover { background: var(--surface-2); }
.menu button svg { width: 17px; height: 17px; color: var(--muted); }
.menu button small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 400; }
.menu .danger, .menu .danger svg { color: var(--bad); }
/* zrobione */
.item.done .tick { cursor: default; }
.item.done .tick span { background: var(--ok); border-color: var(--ok); color: #fff; }
.item.done .t { font-weight: 500; color: var(--fg-2); text-decoration: line-through; text-decoration-color: var(--line-2); }

.empty { padding: 26px 16px; text-align: center; color: var(--muted); font-size: 14.5px;
  border: 1.5px dashed var(--line-2); border-radius: 16px; }
.skeleton { height: 64px; background: linear-gradient(90deg, var(--surface-2), var(--surface), var(--surface-2));
  background-size: 200% 100%; animation: sh 1.2s ease-in-out infinite; }
.skeleton + .skeleton { border-top: 1px solid var(--line); }
@keyframes sh { to { background-position: -200% 0; } }

.notice { max-width: 440px; margin: 12vh auto 0; text-align: center; padding: 0 16px; }
.notice .ico { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; margin: 0 auto 14px;
  background: var(--accent-soft); color: var(--accent); }
.notice h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.01em; }
.notice p { margin: 0; color: var(--fg-2); }

/* ---------- pływający przycisk (telefon) ---------- */
.fab {
  position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 4;
  width: 56px; height: 56px; border-radius: 18px; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-fg); box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 40%, transparent);
  display: grid; place-items: center; transition: transform .15s;
}
.fab:active { transform: scale(.94); }
.fab svg { width: 24px; height: 24px; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0;
  max-width: calc(100% - 32px); z-index: 6; display: flex; align-items: center; gap: 8px;
  background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-size: 14px; font-weight: 500;
  box-shadow: var(--shadow-lift); transition: opacity .2s, transform .2s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- formularz ---------- */
dialog {
  border: 0; padding: 0; width: 100%; max-width: 460px; max-height: calc(100dvh - 24px);
  background: var(--surface); color: var(--fg); border-radius: 20px; box-shadow: var(--shadow-lift);
}
dialog::backdrop { background: rgba(10,10,14,.42); backdrop-filter: blur(2px); }
dialog[open] { animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(16px); } }
dialog form { padding: 20px; overflow-x: hidden; }
.sheet-head { display: flex; align-items: center; margin-bottom: 14px; }
.sheet-head h2 { flex: 1; margin: 0; font-size: 19px; letter-spacing: -.01em; }
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 13px; font-weight: 550; color: var(--fg-2); margin-bottom: 6px; }
.field small { font-weight: 400; color: var(--muted); }
.input {
  display: block; width: 100%; padding: 11px 12px; font: inherit; font-size: 16px; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line-2); border-radius: 11px; transition: border-color .15s, box-shadow .15s;
}
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { resize: vertical; min-height: 72px; }
.seg { display: flex; gap: 4px; padding: 4px; border: 0; margin: 0; min-width: 0; background: var(--surface-2); border-radius: 12px; }
.seg label { flex: 1; min-width: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label > span {
  display: block; text-align: center; padding: 8px 4px; border-radius: 9px; font-size: 14px; font-weight: 550;
  color: var(--fg-2); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.seg input:checked + span { background: var(--surface); color: var(--fg); box-shadow: var(--shadow), 0 0 0 1px var(--line); }
.seg span .dot { display: inline-block; padding: 0; margin-right: 6px; vertical-align: 1px; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
.hint { margin: 6px 2px 0; font-size: 12.5px; color: var(--muted); }
.row { display: flex; gap: 10px; }
.row .field { flex: 1; min-width: 0; }
.row .field[hidden] { display: none; }
.form-foot { display: flex; gap: 8px; margin-top: 6px; }
.form-foot .btn { flex: 1; height: 44px; font-size: 15px; }
.form-note { margin: 12px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; }

/* ---------- układy ---------- */
@media (max-width: 899px) {
  .top .add-desktop { display: none; }
  .toast { bottom: calc(90px + env(safe-area-inset-bottom)); }
  dialog { margin: auto 0 0; max-width: none; border-radius: 20px 20px 0 0; padding-bottom: env(safe-area-inset-bottom); }
  dialog[open] { animation: sheet .25s ease-out; }
  @keyframes sheet { from { transform: translateY(40px); } }
}
@media (min-width: 900px) {
  .top { padding-top: 28px; padding-bottom: 14px; }
  .hello h1 { font-size: 26px; }
  .tabs, .fab { display: none; }
  /* moje sprawy szeroko po lewej; po prawej sprawy drugiej osoby, pod nimi zrobione */
  .board { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); grid-template-areas: "moje inne" "moje zrobione";
    grid-template-rows: auto 1fr; gap: 28px 36px; align-items: start; }
  .col.moje { grid-area: moje; }
  .col.inne { grid-area: inne; }
  .col.zrobione { grid-area: zrobione; }
  .col[hidden] { display: block; }
  .col-head { display: flex; }
  .col.inne .t, .col.zrobione .t { font-size: 15px; }
}

/* elementy z atrybutem hidden mają zniknąć mimo własnego display */
.demo-bar[hidden], .btn[hidden], .fab[hidden] { display: none; }

/* ---------- strona startowa (bez logowania) ---------- */
body.landing-mode .filters, body.landing-mode .tabs,
body.landing-mode #refresh, body.landing-mode #add, body.landing-mode .fab { display: none !important; }
body.landing-mode header .top { display: none; }
.landing { display: grid; gap: 32px; padding: 28px 0 48px; align-items: start; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; font-weight: 700; font-size: 16px; }
.brand .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }
.brand .logo svg { width: 18px; height: 18px; }
.hero h2 { margin: 0 0 12px; font-size: clamp(30px, 6vw, 44px); line-height: 1.08; letter-spacing: -.03em; }
.hero .lead { margin: 0 0 26px; font-size: 17px; color: var(--fg-2); max-width: 540px; }
.features { list-style: none; padding: 0; margin: 0 0 28px; display: grid; gap: 14px; max-width: 540px; }
.features li { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; color: var(--fg-2); }
.features li b { display: block; color: var(--fg); font-weight: 650; }
.features .f-ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none;
  background: var(--accent-soft); color: var(--accent); }
.features .f-ico svg { width: 16px; height: 16px; }
.cta { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; }
.cta .hint-l { font-size: 13.5px; color: var(--muted); }
.btn.big { height: 48px; padding: 0 22px; font-size: 16px; border-radius: 12px; text-decoration: none; }
.stack { margin: 22px 0 0; font-size: 13px; color: var(--muted); }
.login-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
.login-card h3 { margin: 0 0 4px; font-size: 17px; }
.login-card .sub-l { margin: 0 0 16px; font-size: 13.5px; color: var(--muted); }
.login-card .btn { width: 100%; }
.login-card .err { margin: -4px 0 12px; font-size: 13.5px; color: var(--bad); min-height: 1em; }
@media (min-width: 900px) {
  .landing { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 64px; padding-top: 56px; }
  .login-card { margin-top: 62px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="demo-bar" id="demo-bar" hidden>Tryb demo: przykładowe dane, nic się nie zapisuje. <a href="./">Wyjdź</a></div>
<header id="hdr">
  <div class="wrap">
    <div class="top">
      <div class="hello">
        <h1 id="hello">Kto to ogarnia</h1>
        <p id="today"></p>
      </div>
      <button class="btn primary add-desktop" id="add" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Dodaj sprawę
      </button>
      <button class="btn icon" id="refresh" type="button" title="Odśwież" aria-label="Odśwież">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
      <button class="btn icon" id="logout" type="button" title="Wyloguj" aria-label="Wyloguj" hidden>
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>
      </button>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="filters" id="filters" role="toolbar" aria-label="Filtr kategorii"></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<button class="fab" id="fab" type="button" aria-label="Dodaj sprawę">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form id="form" method="dialog">
    <div class="sheet-head">
      <h2 id="dlg-title">Nowa sprawa</h2>
      <button class="btn icon" type="button" id="cancel-x" aria-label="Zamknij">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <label class="field"><span>Co</span>
      <input class="input" name="tytul" required maxlength="100" placeholder="np. Wycieczka do Krakowa" autocomplete="off">
    </label>
    <div class="field">
      <span>Czego dotyczy</span>
      <fieldset class="seg" id="kategorie"></fieldset>
    </div>
    <div class="field">
      <span>Rodzaj</span>
      <fieldset class="seg">
        <legend class="sr" hidden>Rodzaj</legend>
        <label><input type="radio" name="rodzaj" value="Do dnia"><span>Do dnia</span></label>
        <label><input type="radio" name="rodzaj" value="W dniu" checked><span>W dniu</span></label>
        <label><input type="radio" name="rodzaj" value="Wydarzenie"><span>O godzinie</span></label>
      </fieldset>

<script>
// ---- konfiguracja (adres API = webhook Make z ?cel=api; dane chroni para u + s) ----
const CONFIG = {
  api: "https://hook.eu2.make.com/wpcm5vpf5m75aeb84hk2ukxvcc7sky5v?cel=api",
  // odczyt listy przez Google Apps Script (apps-script/lista.gs) – bez operacji Make; pusty = lista z Make
  lista: "https://script.google.com/macros/s/AKfycbwaBpd7UpIlvPCi8e4nDQ1t1hJSQrr7OUoQy72I7xufYyEMc5lMMKYLomFKodU8Skx3/exec",
  // przykładowi domownicy i kategorie (tryb demo); po zalogowaniu zastępują je prawdziwe z API –
  // dzięki temu publiczny kod strony nie zawiera imion domowników
  rodzice: [{ imie: "Ewa", klucz: "ewa" }, { imie: "Adam", klucz: "adam" }],
  kategorie: ["Szymon", "Michał", "Dom"],
};
const KOLORY_RODZICOW = ["#6d5efc", "#d4467e", "#0891b2", "#65a30d"];
const KOLORY_KATEGORII = ["#2f7fd6", "#0d9488", "#e07b24", "#9333ea", "#db2777", "#4d7c0f"];
// konfiguracja z odpowiedzi API (rodzice: [{imie, klucz}], kategorie: [nazwa]) – kolory wg kolejności
function ustawKonfig(j) {
  if (Array.isArray(j.rodzice) && j.rodzice.length) CONFIG.rodzice = j.rodzice;
  if (Array.isArray(j.kategorie) && j.kategorie.length) CONFIG.kategorie = j.kategorie;
  CONFIG.rodzice = CONFIG.rodzice.map((r, i) => ({ ...r, kolor: KOLORY_RODZICOW[i % KOLORY_RODZICOW.length] }));
  CONFIG.kategorie = CONFIG.kategorie.map((k, i) =>
    ({ nazwa: k.nazwa || k, kolor: KOLORY_KATEGORII[i % KOLORY_KATEGORII.length] }));
  if ($("kategorie")) renderKategorie();
}

const H = 3600e3;
const state = { ja: "", zadania: [], tab: "moje", busy: new Set(), loaded: false, showDone: false, filtr: "", menu: null, otwarte: new Set() };
const $ = (id) => document.getElementById(id);

// ---- ikony ----
const I = {
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-1.5 4L16 12H5"/></svg>',
  coin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6.5v1.5M12 16v1.5"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5M12 16h.01"/></svg>',
  hour: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  lock: '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>',
};

// ---- logowanie: ?u=&s= raz zapisane w localStorage i usunięte z paska adresu ----
function store(key, val) {
  try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; }
}
function login() {
  const p = new URLSearchParams(location.search);
  if (p.get("u") && p.get("s")) {
    store("u", p.get("u")); store("s", p.get("s"));
    p.delete("u"); p.delete("s");
    history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p : ""));
  }
  return { u: store("u"), s: store("s"), demo: p.get("demo") === "1" };
}
const auth = login();
state.filtr = store("filtr") || "";

// ---- API: proste POST-y (form-urlencoded), bez preflightu ----
async function call(akcja, id, extra = {}) {
  if (auth.demo) return demoCall(akcja, id, extra);
  if (akcja === "lista" && CONFIG.lista) {
    // Apps Script: POST z JSON jako text/plain (bez preflightu); odpowiedź po przekierowaniu Google
    const r = await fetch(CONFIG.lista, { method: "POST", body: JSON.stringify({ u: auth.u || "", s: auth.s || "", akcja }) });
    const j = await r.json().catch(() => ({ ok: false, powod: "niedostepne" }));
    if (!j.ok) throw Object.assign(new Error(j.powod || "blad"), { powod: j.powod });
    return j;
  }
  const body = new URLSearchParams({ u: auth.u || "", s: auth.s || "", akcja, ...extra });
  if (id) body.set("id", id);
  const r = await fetch(CONFIG.api, { method: "POST", body });
  // „Accepted” zamiast JSON = Make przyjął żądanie do kolejki, bo scenariusz jest wstrzymany
  const j = await r.json().catch(() => ({ ok: false, powod: "niedostepne" }));
  if (!r.ok || !j.ok) throw Object.assign(new Error(j.powod || "blad"), { powod: j.powod });
  return j;
}

// ---- formatowanie ----
const TZ = "Europe/Warsaw";
const fmtTime = new Intl.DateTimeFormat("pl-PL", { hour: "2-digit", minute: "2-digit", timeZone: TZ });
const fmtDate = new Intl.DateTimeFormat("pl-PL", { day: "numeric", month: "short", timeZone: TZ });
const fmtToday = new Intl.DateTimeFormat("pl-PL", { weekday: "long", day: "numeric", month: "long", timeZone: TZ });
const dayKey = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(d);
const zlCale = new Intl.NumberFormat("pl-PL", { style: "currency", currency: "PLN", maximumFractionDigits: 0 });
const zlGrosze = new Intl.NumberFormat("pl-PL", { style: "currency", currency: "PLN", minimumFractionDigits: 2 });
const zl = { format: (v) => (Number.isInteger(+v) ? zlCale : zlGrosze).format(v) };
const fmtDzienTyg = new Intl.DateTimeFormat("pl-PL", { weekday: "short", timeZone: TZ });
const dzienTyg = (d) => fmtDzienTyg.format(d).replace(".", "");
// ile dni kalendarzowych (w Polsce) od dziś do d: 0 = dziś, 1 = jutro, -1 = wczoraj
const dniOd = (d) => Math.round((new Date(dayKey(d)) - new Date(dayKey(new Date()))) / 864e5);
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const katKolor = (k) => (CONFIG.kategorie.find((x) => x.nazwa === k) || {}).kolor;
const drugi = () => CONFIG.rodzice.find((r) => r.imie !== state.ja) || CONFIG.rodzice[1];

// ---- model ----
function view(z) {
  const f = z.fields, termin = new Date(f["Termin"]), rodzaj = f["Rodzaj"] || "Wydarzenie";
  const n = dniOd(termin);
  return {
    id: z.id, tytul: f["Tytuł"] || "(bez tytułu)", opis: f["Opis"] || "", kwota: f["Kwota"],
    status: f["Status"], osoba: (f["Osoba imię"] || "").trim(), termin, rodzaj, n,
    kategoria: f["Kategoria"] || "",
    // „Do dnia” i „W dniu” są po terminie dopiero następnego dnia; wydarzenie – gdy minie jego godzina
    late: f["Status"] !== "Zrobione" && (n < 0 || (rodzaj === "Wydarzenie" && termin < new Date())),
    zrobiono: f["Zrobiono"] ? new Date(f["Zrobiono"]) : null,
  };
}
function columns() {
  // sprawa bez osoby (starsze dane) należy do domyślnego właściciela – pierwszego rodzica z CONFIG
  const wlasciciel = (z) => z.osoba || CONFIG.rodzice[0].imie;
  const all = widoczne();
  const byTermin = (a, b) => a.termin - b.termin;
  return [
    { key: "moje", label: "Moje sprawy", short: "Moje", items: all.filter((z) => z.status !== "Zrobione" && wlasciciel(z) === state.ja).sort(byTermin) },
    { key: "inne", label: drugi().imie, items: all.filter((z) => z.status !== "Zrobione" && wlasciciel(z) !== state.ja).sort(byTermin) },
    { key: "zrobione", label: "Zrobione", items: all.filter((z) => z.status === "Zrobione").sort((a, b) => (b.zrobiono || 0) - (a.zrobiono || 0)) },
  ];
}
// grupy według terminu – najpierw to, co pilne
const GRUPY = [
  ["late", "Po terminie", (z) => z.late],
  ["dzis", "Dziś", (z) => z.n === 0],
  ["jutro", "Jutro", (z) => z.n === 1],
  ["tydzien", "W ciągu tygodnia", (z) => z.n <= 7],
  ["pozniej", "Później", () => true],
];
function grupuj(items) {
  const out = GRUPY.map(([key, label]) => ({ key, label, items: [] }));
  for (const z of items) out[GRUPY.findIndex(([, , test]) => test(z))].items.push(z);
  return out.filter((g) => g.items.length);
}

// ---- widok ----
const PUSTE = {
  moje: "Nic na Twojej głowie. 🎉",
  inne: "Tu nic nie ma.",
  zrobione: "Jeszcze nic w tym tygodniu.",
};
// termin jednym krótkim tekstem; w grupach Dziś i Jutro data jest w nagłówku, więc zostaje tylko godzina
function termin(z, grupa) {
  const d = z.termin, data = `${dzienTyg(d)} ${fmtDate.format(d)}`;
  const godz = z.rodzaj === "Wydarzenie" ? fmtTime.format(d) : "";
  if (grupa === "late") {
    const ile = z.n === 0 ? `dziś ${godz}` : z.n === -1 ? "wczoraj" : `${-z.n} dni temu`;
    return `<span class="late">${z.rodzaj === "Do dnia" ? "termin minął " : ""}${esc(ile)}</span>`;
  }
  if (grupa === "dzis" || grupa === "jutro") {
    if (godz) return `<span>${godz}</span>`;
    return z.rodzaj === "Do dnia" ? `<span>do końca dnia</span>` : "";
  }
  if (z.rodzaj === "Do dnia") return `<span>do ${esc(data)}</span>`;
  return `<span>${esc(data)}${godz ? `, ${godz}` : ""}</span>`;
}
function item(z, col, grupa) {
  const kat = z.kategoria ? `<span class="kat"><span class="dot" style="--kat:${katKolor(z.kategoria)}"></span>${esc(z.kategoria)}</span>` : "";
  const kwota = z.kwota ? `<span>${esc(zl.format(z.kwota))}</span>` : "";
  if (col === "zrobione") {
    const kiedyZ = z.zrobiono ? `<span>${esc(`${dzienTyg(z.zrobiono)} ${fmtDate.format(z.zrobiono)}`)}</span>` : "";
    return `<article class="item done"><span class="tick" aria-hidden="true"><span>${I.check}</span></span>
      <div class="body"><p class="t">${esc(z.tytul)}</p>
      <div class="meta">${kiedyZ}${z.osoba ? `<span>${esc(z.osoba)}</span>` : ""}${kat}</div></div></article>`;
  }
  const otwarte = state.menu === z.id;
  const menu = !otwarte ? "" : `<div class="menu" role="menu">
    ${col === "moje" ? `<button type="button" role="menuitem" data-akcja="przypisz" data-id="${z.id}">${I.arrow}
      <span>Przekaż: ${esc(drugi().imie)}<small>dostanie maila</small></span></button>` : ""}
    <button type="button" role="menuitem" class="danger" data-usun="${z.id}">${I.trash}<span>Usuń sprawę</span></button></div>`;
  return `<article class="item ${z.late ? "late" : ""} ${state.busy.has(z.id) ? "busy" : ""}" data-id="${z.id}">
    <button class="tick" type="button" data-akcja="done" data-id="${z.id}" title="Oznacz jako zrobione"
      aria-label="Zrobione: ${esc(z.tytul)}"><span>${I.check}</span></button>
    <div class="body"><p class="t">${esc(z.tytul)}</p>
      <div class="meta">${termin(z, grupa)}${kat}${kwota}</div>
      ${z.opis ? `<p class="opis ${state.otwarte.has(z.id) ? "open" : ""}" data-opis="${z.id}" title="Pokaż całość">${esc(z.opis)}</p>` : ""}
    </div>
    <button class="kebab" type="button" data-menu="${z.id}" aria-label="Więcej: ${esc(z.tytul)}" aria-haspopup="menu"
      aria-expanded="${otwarte}">${I.more}</button>${menu}
  </article>`;
}
function lista(c) {
  if (!c.items.length) return `<div class="empty">${PUSTE[c.key]}</div>`;
  if (c.key === "zrobione") return `<div class="rows">${c.items.map((z) => item(z, c.key)).join("")}</div>`;
  return grupuj(c.items).map((g) => `<section class="group ${g.key}">
    <h3 class="group-head">${g.label} <span class="n">${g.items.length}</span></h3>
    <div class="rows">${g.items.map((z) => item(z, c.key, g.key)).join("")}</div></section>`).join("");
}
function render() {
  const cols = columns();
  const late = cols[0].items.filter((z) => z.late).length;
  $("filters").innerHTML = [["", "Wszystko"], ...CONFIG.kategorie.map((k) => [k.nazwa, k.nazwa])].map(([v, l]) =>
    `<button class="fchip" type="button" data-filtr="${esc(v)}" aria-pressed="${state.filtr === v}">` +
    `${v ? `<span class="dot" style="--kat:${katKolor(v)}"></span>` : ""}${esc(l)}</button>`).join("");
  $("hello").textContent = state.ja ? `Cześć, ${state.ja}` : "Kto to ogarnia";
  $("tabs").innerHTML = cols.map((c, i) =>
    `<button class="tab" role="tab" type="button" data-tab="${c.key}" aria-selected="${state.tab === c.key}">${esc(c.short || c.label)}
      <span class="n ${i === 0 && late ? "bad" : ""}">${c.items.length}</span></button>`).join("");
  const desktop = innerWidth >= 900;
  $("main").innerHTML = `<div class="board">${cols.map((c) => {
    // zrobione na komputerze zwinięte – rozwija je przycisk w nagłówku
    const zwiniete = c.key === "zrobione" && desktop && !state.showDone;
    const toggle = c.key === "zrobione" && desktop && c.items.length
      ? `<button class="toggle" type="button" id="show-done">${state.showDone ? "Zwiń" : "Pokaż"}</button>` : "";
    return `<section class="col ${c.key}" ${state.tab === c.key ? "" : "hidden"}>
      <div class="col-head"><h2>${esc(c.label)}</h2><span class="n">${c.items.length}</span>${toggle}</div>
      ${zwiniete ? "" : lista(c)}</section>`;
  }).join("")}</div>`;
}
function widoczne() {
  const all = state.zadania.map(view);
  return state.filtr ? all.filter((z) => z.kategoria === state.filtr) : all;
}
function skeleton() {
  $("main").innerHTML = `<div class="board"><section class="col"><div class="group"><div class="rows">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div></section></div>`;
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 3200);
}
function niedostepne() {
  $("tabs").innerHTML = ""; $("filters").innerHTML = "";
  $("main").innerHTML = `<div class="notice"><div class="ico">${I.alert}</div><h2>Lista chwilowo niedostępna</h2>
    <p>Serwer z zadaniami (Make) nie odpowiada – najczęściej dlatego, że skończył się miesięczny limit operacji.
    Spróbuj później przyciskiem odświeżania u góry.</p></div>`;
}
// strona startowa: opis aplikacji (portfolio), demo i logowanie hasłem
function noAccess(blad = "") {
  document.body.classList.add("landing-mode");
  $("logout").hidden = true;
  $("hello").textContent = "Kto to ogarnia";
  $("today").textContent = "Domowe sprawy z właścicielem";
  const f = (ikona, tytul, opis) =>
    `<li><span class="f-ico">${ikona}</span><span><b>${tytul}</b>${opis}</span></li>`;
  $("main").innerHTML = `<section class="landing">
    <div class="hero">
      <div class="brand"><span class="logo">${I.check}</span>Kto to ogarnia</div>
      <h2>Każda domowa sprawa ma&nbsp;swojego właściciela</h2>
      <p class="lead">Zgody, wpłaty, zebrania w szkole i rachunki w jednym miejscu. Widać, kto się czym zajmuje,
        a dzień przed terminem przychodzi przypomnienie.</p>
      <ul class="features">
        ${f(I.arrow, "Dodawanie jednym zdaniem", "„dodaj: zebranie w czwartek 17:00” do asystenta AI albo krótki formularz.")}
        ${f(I.flag, "Jedna sprawa, jedna osoba", "przekazanie drugiemu rodzicowi jednym kliknięciem, z mailem.")}
        ${f(I.clock, "Przypomnienie dzień przed", "tylko do właściciela sprawy, bez zasypywania skrzynki.")}
      </ul>
      <div class="cta">
        <a class="btn primary big" href="?demo=1">Zobacz demo</a>
        <span class="hint-l">bez logowania, na przykładowych danych</span>
      </div>
      <p class="stack">Make · Airtable · Google Apps Script · Gmail · Claude</p>
    </div>
    <form class="login-card" id="login" autocomplete="on">
      <h3>Zaloguj się</h3>
      <p class="sub-l">Dla domowników.</p>
      <label class="field"><span>Login</span>
        <input class="input" name="u" id="login-u" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="field"><span>Hasło</span>
        <input class="input" name="s" id="login-s" type="password" autocomplete="current-password" required></label>
      <p class="err" id="login-err">${esc(blad)}</p>
      <button class="btn primary big" type="submit" id="login-btn">Zaloguj</button>
    </form>
  </section>`;
}

// ---- dane i akcje ----
// Każde pobranie listy to operacje Make (limit darmowego planu), więc lista jest trzymana w telefonie
// i pobierana z serwera dopiero, gdy jest starsza niż ŚWIEŻOŚĆ – albo po kliknięciu „Odśwież”.
// z Apps Script lista jest darmowa, więc może być świeża; z Make – oszczędnie
const SWIEZOSC = CONFIG.lista ? 60e3 : 30 * 60e3;
const cacheKey = () => `lista:${auth.demo ? "demo" : auth.u}`;
let pobrano = 0;
function zapiszCache() {
  pobrano = pobrano || Date.now();
  if (!auth.demo) store(cacheKey(), JSON.stringify({ t: pobrano, ja: state.ja, zadania: state.zadania,
    rodzice: CONFIG.rodzice.map(({ imie, klucz }) => ({ imie, klucz })), kategorie: CONFIG.kategorie.map((k) => k.nazwa) }));
}
function zCache() {
  try {
    const c = JSON.parse(store(cacheKey()) || "null");
    if (!c || !Array.isArray(c.zadania)) return false;
    ustawKonfig(c);
    state.ja = c.ja; state.zadania = c.zadania; state.loaded = true; pobrano = c.t;
    render();
    return true;
  } catch (e) { return false; }
}
async function load(wymus = false) {
  if (!auth.demo && (!auth.u || !auth.s)) return noAccess();
  if (!wymus && state.loaded && Date.now() - pobrano < SWIEZOSC) return;
  if (!state.loaded) skeleton();
  $("refresh").classList.add("spin");
  try {
    const j = await call("lista");
    ustawKonfig(j);
    state.ja = j.ja; state.zadania = j.zadania || []; state.loaded = true;
    pobrano = Date.now(); zapiszCache();
    render();
  } catch (e) {
    if (e.powod === "brak_dostepu") {
      // zapamiętane hasło przestało pasować (np. po zmianie haseł) – zapomnij je i pokaż logowanie
      try { localStorage.removeItem("u"); localStorage.removeItem("s"); } catch (err) {}
      auth.u = null; auth.s = null;
      return noAccess("Hasło się zmieniło – zaloguj się ponownie.");
    }
    if (!state.loaded) return niedostepne();
    toast(pobrano ? `Brak połączenia – lista z ${fmtTime.format(new Date(pobrano))}` : "Nie udało się pobrać listy.");
  } finally {
    $("refresh").classList.remove("spin");
  }
}
const OCZEKIWANE = { done: "Zrobione", przypisz: "Przypisane" };
const POTWIERDZENIA = { done: "Zrobione – dzięki!", przypisz: () => `Przekazane: ${drugi().imie} – dostanie maila` };
// usunięcie po potwierdzeniu: sprawa dostaje status Anulowane (zostaje w Airtable, da się przywrócić)
async function usun(id) {
  const idx = state.zadania.findIndex((z) => z.id === id);
  if (idx < 0) return;
  const tytul = state.zadania[idx].fields["Tytuł"] || "tę sprawę";
  if (!confirm(`Czy na pewno usunąć „${tytul}”?`)) return;
  const usunieta = state.zadania.splice(idx, 1)[0];
  render();
  try {
    await call("usun", id);
    zapiszCache();
    toast("Usunięte");
  } catch (e) {
    state.zadania.splice(idx, 0, usunieta); render();
    toast(e.powod === "brak_dostepu" ? "Brak dostępu" : "Nie udało się usunąć. Spróbuj jeszcze raz.");
  }
}
async function act(akcja, id) {
  const idx = state.zadania.findIndex((z) => z.id === id);
  if (idx < 0) return;
  const before = structuredClone(state.zadania[idx]);
  // optymistycznie: karta od razu przechodzi do nowej kolumny
  const f = state.zadania[idx].fields;
  f["Status"] = OCZEKIWANE[akcja];
  if (akcja === "przypisz") f["Osoba imię"] = drugi().imie;
  if (akcja === "done") { f["Zrobiono"] = new Date().toISOString(); f["Osoba imię"] ||= state.ja; }
  state.busy.add(id); render();
  try {
    // serwer odpowiada tylko {ok:true} (bez ponownego odczytu – oszczędność operacji Make);
    // gdyby druga osoba zmieniła zadanie w międzyczasie, prawdziwy stan pokaże najbliższe pobranie listy
    await call(akcja, id, akcja === "przypisz" ? { dla: drugi().klucz } : {});
    zapiszCache();
    toast(typeof POTWIERDZENIA[akcja] === "function" ? POTWIERDZENIA[akcja]() : POTWIERDZENIA[akcja]);
  } catch (e) {
    state.zadania[idx] = before;
    toast(e.powod === "brak_dostepu" ? "Brak dostępu" : "Nie udało się. Spróbuj jeszcze raz.");
  } finally {
    state.busy.delete(id); render();
  }
}

// ---- dodawanie sprawy z formularza ----
// godzina ustawiana tylko dla wydarzeń; dla pozostałych rodzajów stała godzina służy
// wyłącznie przypomnieniom (W dniu – przed szkołą, Do dnia – wieczorem tego dnia)
const GODZINA = { "W dniu": "07:30", "Do dnia": "20:00" };
const OPIS_RODZAJU = {
  "Do dnia": "Zrobić najpóźniej tego dnia – np. oddać zgodę, zapłacić.",
  "W dniu": "Tego konkretnego dnia – np. przynieść 20 zł, strój na WF.",
  "Wydarzenie": "O konkretnej godzinie – np. zebranie, występ.",
};
function syncRodzaj() {
  const f = $("form"), r = f.rodzaj.value;
  $("godzina-pole").hidden = r !== "Wydarzenie";
  f.godzina.required = r === "Wydarzenie";
  $("rodzaj-hint").textContent = OPIS_RODZAJU[r];
}
function renderKategorie() {
  $("kategorie").innerHTML = '<legend hidden>Czego dotyczy</legend>' + CONFIG.kategorie.map((k) =>
    `<label><input type="radio" name="kategoria" value="${esc(k.nazwa)}" required><span><span class="dot" style="--kat:${k.kolor}"></span>${esc(k.nazwa)}</span></label>`).join("");
}
ustawKonfig({});
function openAdd() {
  if (!auth.demo && (!auth.u || !auth.s)) return noAccess();
  const f = $("form"); f.reset();
  const wybrana = state.filtr && [...f.querySelectorAll("input[name=kategoria]")].find((x) => x.value === state.filtr);
  if (wybrana) wybrana.checked = true;
  const jutro = new Date(); jutro.setDate(jutro.getDate() + 1);
  const pad = (n) => String(n).padStart(2, "0");
  f.dzien.value = `${jutro.getFullYear()}-${pad(jutro.getMonth() + 1)}-${pad(jutro.getDate())}`;
  syncRodzaj();
  $("dlg").showModal(); f.tytul.focus();
}
async function add(e) {
  e.preventDefault();
  const f = $("form"), rodzaj = f.rodzaj.value;
  const termin = new Date(`${f.dzien.value}T${rodzaj === "Wydarzenie" ? f.godzina.value : GODZINA[rodzaj]}`);
  if (!(termin > new Date())) { toast("Termin musi być w przyszłości."); return; }
  const dane = {
    tytul: f.tytul.value.trim(), termin: termin.toISOString(), opis: f.opis.value.trim(), rodzaj, kategoria: f.kategoria.value,
    kwota: f.kwota.value, id_zrodla: "dash-" + crypto.randomUUID(),
  };
  $("save").disabled = true; $("save").textContent = "Dodaję…";
  try {
    const j = await call("dodaj", null, dane);
    // serwer zwraca tylko ID nowego rekordu – kartę budujemy z danych formularza
    state.zadania.push({ id: j.id, fields: {
      "Tytuł": dane.tytul, "Opis": dane.opis, "Termin": dane.termin, "Rodzaj": rodzaj, "Kategoria": dane.kategoria,
      "Kwota": dane.kwota ? Number(dane.kwota) : undefined, "Status": "Przypisane", "Osoba imię": CONFIG.rodzice[0].imie,
      "Utworzono": new Date().toISOString() } });
    state.tab = "moje"; zapiszCache();
    $("dlg").close(); render(); toast("Dodane");
  } catch (err) {
    toast(err.powod === "blad_danych" ? "Sprawdź tytuł i termin." : "Nie udało się dodać. Spróbuj jeszcze raz.");
  } finally {
    $("save").disabled = false; $("save").textContent = "Dodaj";
  }
}
$("form").addEventListener("submit", add);
$("form").addEventListener("change", (e) => { if (e.target.name === "rodzaj") syncRodzaj(); });
$("dlg").addEventListener("click", (e) => { if (e.target === $("dlg")) $("dlg").close(); });

// ---- logowanie hasłem (sprawdzane tym samym zapytaniem co lista) i wylogowanie ----
function pokazAplikacje() {
  document.body.classList.remove("landing-mode");
  $("add").hidden = false; $("fab").hidden = false; $("logout").hidden = auth.demo;
  $("today").textContent = fmtToday.format(new Date()).replace(/^./, (c) => c.toUpperCase());
}
async function zaloguj(u, s) {
  $("login-btn").disabled = true; $("login-btn").textContent = "Loguję…"; $("login-err").textContent = "";
  auth.u = u; auth.s = s.trim();
  try {
    const j = await call("lista");
    store("u", auth.u); store("s", auth.s);
    ustawKonfig(j);
    state.ja = j.ja; state.zadania = j.zadania || []; state.loaded = true; pobrano = Date.now(); zapiszCache();
    pokazAplikacje(); render();
  } catch (e) {
    auth.u = null; auth.s = null;
    noAccess(e.powod === "brak_dostepu" ? "Nieprawidłowe hasło." : "Nie udało się połączyć. Spróbuj za chwilę.");
  }
}
function wyloguj() {
  try { Object.keys(localStorage).filter((k) => k === "u" || k === "s" || k.startsWith("lista:")).forEach((k) => localStorage.removeItem(k)); } catch (e) {}
  location.href = location.pathname;
}
document.addEventListener("submit", (e) => {
  if (e.target.id !== "login") return;
  e.preventDefault();
  zaloguj($("login-u").value.trim().toLowerCase(), $("login-s").value);
});

document.addEventListener("click", (e) => {
  const op = e.target.closest("[data-opis]");
  if (op) { state.otwarte.has(op.dataset.opis) ? state.otwarte.delete(op.dataset.opis) : state.otwarte.add(op.dataset.opis); render(); return; }
  const b = e.target.closest("button");
  // klik poza menu zamyka je
  if (state.menu && !(b && (b.dataset.menu || b.closest(".menu")))) { state.menu = null; render(); }
  if (!b) return;
  if (b.dataset.menu) { state.menu = state.menu === b.dataset.menu ? null : b.dataset.menu; render(); return; }
  if (b.closest(".menu")) state.menu = null;
  if (b.dataset.akcja) act(b.dataset.akcja, b.dataset.id);
  else if (b.dataset.usun) usun(b.dataset.usun);
  else if (b.dataset.tab) { state.tab = b.dataset.tab; render(); scrollTo({ top: 0 }); }
  else if (b.id === "refresh") load(true);
  else if (b.id === "logout") wyloguj();
  else if (b.id === "add" || b.id === "fab") openAdd();
  else if (b.id === "cancel" || b.id === "cancel-x") $("dlg").close();
  else if (b.id === "show-done") { state.showDone = !state.showDone; render(); }
  else if (b.dataset.filtr !== undefined) { state.filtr = b.dataset.filtr; store("filtr", state.filtr); render(); }
});
addEventListener("keydown", (e) => { if (e.key === "Escape" && state.menu) { state.menu = null; render(); } });
addEventListener("scroll", () => $("hdr").classList.toggle("scrolled", scrollY > 4), { passive: true });
addEventListener("resize", () => { clearTimeout(render.t); render.t = setTimeout(() => state.loaded && render(), 150); });
// przy powrocie do karty pobieramy listę tylko, jeśli jest nieświeża; stałe odświeżanie tylko z Apps Script
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
if (CONFIG.lista) setInterval(() => { if (!document.hidden) load(); }, 5 * 60e3);

$("today").textContent = fmtToday.format(new Date()).replace(/^./, (c) => c.toUpperCase());

// ---- tryb demo (?demo=1): przykładowe dane bez API ----
function demoCall(akcja, id, extra = {}) {
  const now = Date.now(), iso = (h) => new Date(now + h * H).toISOString();
  if (akcja === "dodaj") {
    const z = { id: "d" + now, fields: { "Tytuł": extra.tytul, "Opis": extra.opis, "Termin": extra.termin, "Rodzaj": extra.rodzaj, "Kategoria": extra.kategoria, "Osoba imię": "Ewa",
      "Kwota": extra.kwota ? Number(extra.kwota) : undefined, "Status": "Przypisane", "Utworzono": iso(0) } };
    demoCall.data.push(z);
    return new Promise((r) => setTimeout(() => r({ ok: true, id: z.id }), 500));
  }
  if (akcja === "lista") {
    demoCall.data ||= [
      { id: "d1", fields: { "Tytuł": "Wycieczka do Krakowa", "Kategoria": "Szymon", "Opis": "Przynieść 40 zł i podpisaną zgodę", "Termin": iso(40), "Rodzaj": "W dniu", "Kwota": 40, "Status": "Przypisane", "Osoba imię": "Ewa", "Utworzono": iso(-6) } },
      { id: "d2", fields: { "Tytuł": "Zebranie z wychowawczynią", "Kategoria": "Szymon", "Termin": iso(20), "Rodzaj": "Wydarzenie", "Status": "Przypisane", "Osoba imię": "Ewa", "Utworzono": iso(-1) } },
      { id: "d3", fields: { "Tytuł": "Strój na WF", "Kategoria": "Szymon", "Opis": "Biała koszulka, granatowe spodenki", "Termin": iso(-26), "Rodzaj": "W dniu", "Status": "Przypisane", "Osoba imię": "Ewa", "Utworzono": iso(-30) } },
      { id: "d4", fields: { "Tytuł": "Opłata za obiady", "Kategoria": "Michał", "Termin": iso(100), "Rodzaj": "Do dnia", "Kwota": 182.5, "Status": "Przypisane", "Osoba imię": "Adam", "Utworzono": iso(-20) } },
      { id: "d5", fields: { "Tytuł": "Kredki na plastykę", "Kategoria": "Michał", "Termin": iso(-48), "Rodzaj": "W dniu", "Status": "Zrobione", "Osoba imię": "Adam", "Zrobiono": iso(-50), "Utworzono": iso(-80) } },
      { id: "d7", fields: { "Tytuł": "Rachunek za prąd", "Termin": iso(70), "Rodzaj": "Do dnia", "Kwota": 214.3, "Kategoria": "Dom", "Status": "Przypisane", "Osoba imię": "Ewa", "Utworzono": iso(-2) } },
      { id: "d6", fields: { "Tytuł": "Zgoda na basen", "Kategoria": "Szymon", "Termin": iso(-30), "Rodzaj": "Do dnia", "Status": "Zrobione", "Osoba imię": "Ewa", "Zrobiono": iso(-32), "Utworzono": iso(-90) } },
    ];
    return new Promise((r) => setTimeout(() => r({ ok: true, ja: "Ewa", zadania: structuredClone(demoCall.data) }), 300));
  }
  if (akcja === "usun") {
    demoCall.data = demoCall.data.filter((x) => x.id !== id);
    return new Promise((r) => setTimeout(() => r({ ok: true }), 400));
  }
  const z = structuredClone(demoCall.data.find((x) => x.id === id));
  const f = z.fields;
  if (akcja === "done") { f["Status"] = "Zrobione"; f["Zrobiono"] = new Date().toISOString(); f["Osoba imię"] ||= "Ewa"; }
  else if (akcja === "przypisz") { f["Status"] = "Przypisane"; f["Osoba imię"] = "Adam"; }
  demoCall.data[demoCall.data.findIndex((x) => x.id === id)] = z;
  return new Promise((r) => setTimeout(() => r({ ok: true, zadanie: structuredClone(z) }), 500));
}

$("demo-bar").hidden = !auth.demo;
if (auth.demo || (auth.u && auth.s)) pokazAplikacje();
if (!auth.demo && auth.u && auth.s) zCache();
load();
</script>
