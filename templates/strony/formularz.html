<!-- Wstawiany jako {{przycisk_html}} w potwierdzenie.html, gdy zadanie można wziąć/zamknąć. {{klasa}} = "" dla take, "done" dla done. -->
<form method="post" action="{{S2_WEBHOOK_URL}}">
<input type="hidden" name="t" value="{{t}}"><input type="hidden" name="a" value="{{a}}">
<input type="hidden" name="p" value="{{p}}"><input type="hidden" name="k" value="{{k}}">
<input type="hidden" name="ok" value="1">
<button type="submit" class="{{klasa}}">{{etykieta}}</button>
</form>
