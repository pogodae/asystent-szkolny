<!-- S2, gałąź Potwierdzenie (GET). {{przycisk_html}} = formularz poniżej albo komunikat "Już przejęte przez X" / "Zadanie zamknięte". -->
<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>{{tytul}}</title>
<style>
:root{color-scheme:light dark;--bg:#f4f4f5;--card:#fff;--fg:#18181b;--muted:#71717a;--btn:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#18181b;--card:#27272a;--fg:#fafafa;--muted:#a1a1aa}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:480px;margin:0 auto;padding:24px 16px}.card{background:var(--card);border-radius:14px;padding:24px}
h1{font-size:22px;line-height:1.3;margin:0 0 12px}p{margin:0 0 12px}.muted{color:var(--muted);font-size:14px}
.opis{white-space:pre-line}button,.btn{display:block;width:100%;padding:16px;border:0;border-radius:10px;background:var(--btn);color:#fff;font-size:18px;font-weight:600;text-align:center;text-decoration:none;cursor:pointer;margin-top:8px}
.done{--btn:#16a34a}a{color:var(--btn)}
</style>
</head><body><main><div class="card">
<p class="muted">Sprawa ze szkoły</p>
<h1>{{tytul}}</h1>
<p><strong>Termin:</strong> {{termin_dlugi}}</p>
{{kwota_html}}
<p class="opis">{{opis}}</p>
{{przycisk_html}}
<p class="muted" style="margin-top:16px"><a href="{{DASHBOARD_URL}}">Zobacz wszystkie sprawy</a></p>
</div></main></body></html>
